# GitHub -> Netlify deploy. Static site, no build step.
# Publish the repo root as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/images/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/images/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
